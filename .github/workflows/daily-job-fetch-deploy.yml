name: Daily Job Fetch and Deploy

on:
  schedule:
    - cron: '30 23 * * *'  # Daily at 5 AM IST
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege by default: every job starts read-only. Only the
# fetch-and-deploy job, which must push job data back to main,
# escalates to contents: write below.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        # lxml is needed by the scraper HTML tests (BeautifulSoup parser)
        run: python -m pip install pytest beautifulsoup4 requests lxml

      - name: Run Python tests
        run: |
          # GitHub runs this script with bash -e (errexit): a failing
          # pytest would abort the script before diagnostics are
          # emitted. Disable errexit around pytest and re-enable after.
          set +e
          python -m pytest tests/ -v --tb=short > pytest_output.txt 2>&1
          status=$?
          set -e
          {
            echo "## Python test results"
            echo ""
            echo '```'
            tail -n 120 pytest_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            tail -n 90 pytest_output.txt | tr -cd '\40-\176\n' > pytest_tail.txt
            split -l 15 pytest_tail.txt pytest_chunk_
            for f in pytest_chunk_*; do
              msg=$(head -c 900 "$f" | tr '\n' '|')
              echo "::error::PYTEST-TAIL ${msg}"
            done
            rm -f pytest_chunk_*
          fi
          exit $status

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install JavaScript test dependencies
        run: npm install --no-audit --no-fund

      - name: Run JavaScript tests
        run: npx jest --ci

  fetch-and-deploy:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # This job commits job data back to main and publishes GitHub
    # Pages, so it needs write access. Everything else stays read-only.
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create logs directory
      run: mkdir -p logs

    - name: Generate optimized hero background variants (WebP)
      # index.html references hero-bg-720.webp / hero-bg-1280.webp via
      # <picture> sources. Browsers do not fall back when a selected
      # <source> 404s, so these files MUST exist before every deploy.
      # ffmpeg is preinstalled on ubuntu-latest runners. Idempotent:
      # regenerates only when a variant is missing or older than the
      # original hero-bg.jpg (which is always preserved untouched).
      run: |
        command -v ffmpeg >/dev/null 2>&1 || { echo "::error::ffmpeg not found on runner; hero WebP variants would be missing"; exit 1; }
        if [ ! -f hero-bg.jpg ]; then
          echo "hero-bg.jpg missing - skipping WebP generation"
          exit 0
        fi
        gen_variant() {
          out="$1"; width="$2"
          if [ ! -f "$out" ] || [ "hero-bg.jpg" -nt "$out" ]; then
            ffmpeg -y -loglevel error -i hero-bg.jpg \
              -vf "scale=w='min(${width},iw)':h=-2" -c:v libwebp -quality 80 "$out"
            echo "generated $out"
          else
            echo "$out up to date"
          fi
        }
        gen_variant hero-bg-720.webp 720
        gen_variant hero-bg-1280.webp 1280

    - name: Run job fetcher
      run: |
        python fetch_jobs.py 2>&1 | tee logs/fetch_$(date +%Y%m%d_%H%M%S).log
      env:
        PYTHONUNBUFFERED: 1

    - name: Check for new jobs
      id: check_jobs
      run: |
        if [ -f "jobs/job_manifest.json" ]; then
          JOB_COUNT=$(python -c "import json; data=json.load(open('jobs/job_manifest.json')); print(data.get('total_jobs', 0))")
          echo "job_count=$JOB_COUNT" >> $GITHUB_OUTPUT
          if [ -n "$(git status --porcelain -- jobs/ | grep -E '^[?][?]')" ]; then
            echo "new_jobs=true" >> $GITHUB_OUTPUT
          else
            echo "new_jobs=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "job_count=0" >> $GITHUB_OUTPUT
          echo "new_jobs=false" >> $GITHUB_OUTPUT
        fi


    - name: Upload scraper logs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: scraper-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add jobs/
        git add job/
        git add sitemap.xml
        git add logs/
        git add index.html
        git add hero-bg-720.webp hero-bg-1280.webp
        if ! git diff --staged --quiet; then
          git commit -m "🤖 Auto-update jobs data - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        else
          echo "No changes to commit."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        exclude_assets: |
          .github
          logs
          *.py
          requirements.txt
          README.md

    # Job alerts fire only AFTER the deploy step succeeded (master
    # plan Phase 7): no notification can claim success before the
    # site is actually updated.
    - name: Send Telegram notification for new jobs
      if: steps.check_jobs.outputs.new_jobs == 'true' && success()
      run: python telegram_notifier.py
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        PYTHONUNBUFFERED: 1

    - name: Send WhatsApp notification for new jobs
      if: steps.check_jobs.outputs.new_jobs == 'true' && success()
      run: python whatsapp_notifier.py
      env:
        WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
        WHATSAPP_RECIPIENT_ID: ${{ secrets.WHATSAPP_RECIPIENT_ID }}
        PYTHONUNBUFFERED: 1

    - name: Send deployment notification
      # Deploy runs only on main; never claim deployment success on
      # other branches where the deploy step was skipped.
      if: github.ref == 'refs/heads/main' && success()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_GROUP_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="*🛠️ System Update*%0A✅ SarkariSarthi 2.0 successfully updated and deployed!%0A📊 *Total Jobs:* ${{ steps.check_jobs.outputs.job_count }}%0A🔗 *Visit:* [SarkariSarthi 2.0](https://gogocompany.in/sarkari-sarthi/)"

    - name: Send failure notification
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_GROUP_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="*🛠️ System Update*%0A❌ SarkariSarthi 2.0 job fetch failed!%0A📅 *Time:* $(date '+%Y-%m-%d %H:%M:%S UTC')"

  health-check:
    runs-on: ubuntu-latest
    needs: fetch-and-deploy
    if: always() && github.event_name != 'pull_request'

    steps:
    - name: Website Health Check
      run: |
        sleep 30
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://gogocompany.in/sarkari-sarthi/")
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Website is accessible"
        else
          echo "❌ Website returned HTTP $RESPONSE"
          exit 1
        fi

    - name: Send health check failure notification
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_GROUP_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="*🛠️ System Update*%0A⚠️ SarkariSarthi 2.0 website health check failed!%0A🌐 *URL:* [SarkariSarthi 2.0](https://gogocompany.in/sarkari-sarthi/)%0A📅 *Time:* $(date '+%Y-%m-%d %H:%M:%S UTC')"

